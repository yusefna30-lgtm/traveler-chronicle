<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Traveler's Chronicle | سجل الرحالة الذكي</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0d0f12;
      --card: #161a20;
      --gold: #d4af37;
      --gold-dark: #aa820a;
      --text: #ffffff;
      --muted: #8b949e;
      --border: #2d333b;
      --danger: #e63946;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 18px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    
    header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .badge { display: inline-block; padding: 4px 14px; border: 1px solid var(--gold); border-radius: 20px; color: var(--gold); font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; }
    h1 { font-size: 1.4rem; color: var(--text); }
    p.sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .action-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .btn-stamp { width: 100%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border: none; padding: 13px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-stamp:active { transform: scale(0.98); }
    
    .note-input { width: 100%; background: #0d0f12; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 11px; font-size: 0.85rem; }
    .note-input:focus { outline: none; border-color: var(--gold); }

    .photo-actions { display: flex; gap: 10px; }
    .photo-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px dashed var(--gold); border-radius: 8px; padding: 10px; font-size: 0.8rem; color: var(--gold); cursor: pointer; background: rgba(212, 175, 55, 0.05); text-align: center; }
    .photo-btn:active { background: rgba(212, 175, 55, 0.15); }
    input[type="file"] { display: none; }
    
    #photoPreview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; display: none; border: 1px solid var(--gold); }

    /* حاوية خريطة الأقمار الاصطناعية */
    #map { height: 260px; width: 100%; border-radius: 12px; border: 1px solid var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }

    .stamps-list { display: flex; flex-direction: column; gap: 14px; }
    .stamp-card { background: var(--card); border: 1px dashed var(--gold); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .stamp-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .stamp-city { font-weight: bold; font-size: 1.15rem; color: var(--gold); }
    .stamp-weather { font-size: 0.8rem; color: #64b5f6; margin-top: 3px; }
    .stamp-date { font-size: 0.75rem; color: var(--muted); }
    .stamp-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
    .stamp-note { font-size: 0.9rem; color: #ececec; line-height: 1.4; background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 6px; }
    .btn-delete { background: none; border: none; color: var(--muted); font-size: 0.8rem; cursor: pointer; align-self: flex-end; padding: 4px; }
    .btn-delete:hover { color: var(--danger); }
    .empty-state { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 25px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">NFC PASSPORT EDITION</div>
    <h1>سجل الرحالة الذكي</h1>
    <p class="sub">تتبع حي بالأقمار الاصطناعية لمسارات التيشيرت</p>
  </header>

  <div class="action-box">
    <input type="text" id="journeyNote" class="note-input" placeholder="اكتب ذكرى هذه المحطة (اختياري)..." />
    
    <div class="photo-actions">
      <label for="cameraInput" class="photo-btn">
        📸 فتح الكاميرا
      </label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImage(event)">

      <label for="galleryInput" class="photo-btn">
        🖼️ من الألبوم
      </label>
      <input type="file" id="galleryInput" accept="image/*" onchange="handleImage(event)">
    </div>

    <img id="photoPreview" alt="معاينة الصورة" />

    <button class="btn-stamp" onclick="recordLocation()">
      📍 توثيق المحطة مع الطقس والصورة
    </button>
    <p id="statusMsg" style="font-size: 0.8rem; color: var(--gold); text-align: center; display: none;"></p>
  </div>

  <div id="map"></div>

  <div>
    <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--gold);">محطات التيشيرت الموثقة</h3>
    <div class="stamps-list" id="stampsContainer">
      <div class="empty-state">لم يتم توثيق أي محطة بعد. قرّب التيشيرت واضغط على الزر أعلاه!</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let map, markers = [], routePolyline = null;
  let journeys = JSON.parse(localStorage.getItem('shirt_journeys_v3') || '[]');
  let capturedBase64 = null;

  function handleImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = img.width;
        let height = img.height;
        const maxDim = 500;

        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        capturedBase64 = canvas.toDataURL('image/jpeg', 0.65);
        const preview = document.getElementById('photoPreview');
        preview.src = capturedBase64;
        preview.style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function initMap() {
    map = L.map('map').setView([24.7136, 46.6753], 6);
    
    // خريطة تصوير الأقمار الاصطناعية المباشرة عالية الدقة من Esri
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri &mdash; Earthstar Geographics'
    }).addTo(map);

    renderJourneys();
  }

  async function getWeather(lat, lng) {
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
      const data = await res.json();
      return `${Math.round(data.current_weather.temperature)}°C`;
    } catch(e) {
      return "26°C";
    }
  }

  async function recordLocation() {
    const status = document.getElementById('statusMsg');
    const note = document.getElementById('journeyNote').value;
    status.style.display = 'block';
    status.innerText = "جاري التقاط الإحداثيات والطقس...";

    if (!navigator.geolocation) {
      status.innerText = "المتصفح لا يدعم تحديد الموقع.";
      return;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      
      let cityName = "محطة جديدة";
      let weatherInfo = "معتدل";

      try {
        const [geoRes, weatherRes] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`),
          getWeather(lat, lng)
        ]);
        const data = await geoRes.json();
        cityName = data.address.city || data.address.state || data.address.country || "الرياض";
        if (weatherRes) weatherInfo = weatherRes;
      } catch(e) {}

      const newEntry = {
        id: Date.now(),
        city: cityName,
        lat: lat,
        lng: lng,
        weather: weatherInfo,
        note: note,
        photo: capturedBase64,
        date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' })
      };

      journeys.unshift(newEntry);
      
      try {
        localStorage.setItem('shirt_journeys_v3', JSON.stringify(journeys));
      } catch (err) {
        journeys.pop();
        localStorage.setItem('shirt_journeys_v3', JSON.stringify(journeys));
      }
      
      document.getElementById('journeyNote').value = "";
      document.getElementById('photoPreview').style.display = "none";
      document.getElementById('cameraInput').value = "";
      document.getElementById('galleryInput').value = "";
      capturedBase64 = null;

      status.innerText = `تم توثيق المحطة بنجاح في ${cityName}! ✨`;
      renderJourneys();
    }, () => {
      status.innerText = "يرجى تفعيل الـ GPS في الهاتف والسماح بالوصول للموقع.";
    });
  }

  function deleteEntry(id) {
    journeys = journeys.filter(item => item.id !== id);
    localStorage.setItem('shirt_journeys_v3', JSON.stringify(journeys));
    renderJourneys();
  }

  function renderJourneys() {
    const list = document.getElementById('stampsContainer');
    list.innerHTML = "";
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    if (routePolyline) {
      map.removeLayer(routePolyline);
    }

    if (journeys.length === 0) {
      list.innerHTML = `<div class="empty-state">لم يتم توثيق أي محطة بعد.</div>`;
      return;
    }

    const latlngs = [];

    journeys.forEach(j => {
      const card = document.createElement('div');
      card.className = "stamp-card";
      card.innerHTML = `
        <div class="stamp-header">
          <div>
            <div class="stamp-city">📍 ${j.city}</div>
            <div class="stamp-weather">🌤️ درجة الحرارة: ${j.weather}</div>
          </div>
          <div class="stamp-date">${j.date}</div>
        </div>
        ${j.photo ? `<img src="${j.photo}" class="stamp-img" alt="صورة المحطة" />` : ''}
        ${j.note ? `<div class="stamp-note">${j.note}</div>` : ''}
        <button class="btn-delete" onclick="deleteEntry(${j.id})">حذف المحطة ✕</button>
      `;
      list.appendChild(card);

      const marker = L.circleMarker([j.lat, j.lng], {
        color: '#ffffff',
        weight: 2,
        fillColor: '#d4af37',
        fillOpacity: 1,
        radius: 8
      }).addTo(map);
      marker.bindPopup(`<b>${j.city}</b><br>${j.date}<br>${j.weather}`);
      markers.push(marker);

      latlngs.push([j.lat, j.lng]);
    });

    // رسم مسار الرحلة الذهبي المتصل بين المدن
    if (latlngs.length > 1) {
      routePolyline = L.polyline(latlngs, {
        color: '#d4af37',
        weight: 3,
        dashArray: '6, 8',
        opacity: 0.9
      }).addTo(map);
    }

    map.setView([journeys[0].lat, journeys[0].lng], 11);
  }

  window.onload = initMap;
</script>
</body>
</html>
