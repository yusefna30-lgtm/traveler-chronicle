<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>سجل الرحالة الذكي | الخريطة والستوري</title>
  
  <!-- مكتبة الخرائط التفاعلية Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- مكتبة تحويل العناصر إلى صور بدقة عالية -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #0b0d12;
      --card-bg: rgba(20, 24, 33, 0.9);
      --gold: #d4af37;
      --gold-dark: #aa820a;
      --text: #f0f2f5;
      --muted: #8b949e;
      --border: #232936;
      --wa-color: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, #1a2233 0%, var(--bg) 80%);
    }
    .app-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }

    header { text-align: center; padding: 6px 0 10px; border-bottom: 1px solid var(--border); }
    .badge { display: inline-block; padding: 3px 12px; border: 1px solid var(--gold); border-radius: 20px; color: var(--gold); font-size: 0.7rem; font-weight: bold; letter-spacing: 1.5px; margin-bottom: 4px; }
    h1 { font-size: 1.25rem; color: #fff; }
    p.sub { font-size: 0.8rem; color: var(--muted); }

    /* حاوية الخريطة */
    .map-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .map-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: bold;
    }
    #map { width: 100%; height: 210px; background: #12151c; }

    /* صندوق التقاط الصورة */
    .capture-box {
      background: var(--card-bg);
      border: 2px dashed var(--gold);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .capture-box:active { background: rgba(212, 175, 55, 0.08); }
    .camera-icon { font-size: 2.2rem; }
    .capture-btn-label { font-size: 0.95rem; font-weight: bold; color: var(--gold); }
    #cameraInput { display: none; }

    /* منطقة التعديل والمعاينة */
    #editSection { display: none; flex-direction: column; gap: 12px; }

    .preview-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    #previewImg { width: 100%; height: 100%; object-fit: cover; }

    /* شريط البيانات المدمج للستوري */
    .overlay-card {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(9, 10, 15, 0.95) 0%, rgba(9, 10, 15, 0.75) 70%, transparent 100%);
      padding: 36px 16px 20px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .overlay-title { font-size: 1.25rem; font-weight: bold; color: #fff; }
    .overlay-meta { font-size: 0.75rem; color: var(--gold); font-family: monospace; letter-spacing: 0.5px; }
    .overlay-weather { font-size: 0.85rem; color: #e1e4e8; display: flex; align-items: center; gap: 6px; }
    .overlay-caption { font-size: 0.88rem; color: #f0f2f5; margin-top: 4px; line-height: 1.4; border-right: 3px solid var(--gold); padding-right: 8px; }
    .overlay-brand { font-size: 0.65rem; color: var(--muted); margin-top: 6px; letter-spacing: 1.5px; text-transform: uppercase; }

    /* أدوات التعديل */
    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-group { display: flex; flex-direction: column; gap: 5px; text-align: right; }
    .input-group label { font-size: 0.75rem; color: var(--muted); }
    .input-field {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .input-field:focus { border-color: var(--gold); }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }

    /* شبكة أزرار المشاركة */
    .actions-group { display: flex; flex-direction: column; gap: 8px; }
    .action-btn {
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .action-btn:active { transform: scale(0.98); }
    .action-btn.story {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #12151c;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }
    .action-btn.whatsapp {
      background: var(--wa-color);
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }
    .retake-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="badge">TRAVELER CHRONICLE</div>
    <h1>سجل الرحالة والستوري الذكي</h1>
    <p class="sub">خريطة المحطات وتوثيق اللحظات بلمسة التيشيرت</p>
  </header>

  <!-- خريطة المحطات التفاعلية -->
  <div class="map-card">
    <div class="map-header">
      <span>🗺️ خريطة أثر الرحلات</span>
      <span id="pinCount" style="color:var(--muted); font-size:0.75rem;">محطة نشطة</span>
    </div>
    <div id="map"></div>
  </div>

  <!-- زر التقاط صورة المحطة -->
  <div class="capture-box" id="captureBox" onclick="document.getElementById('cameraInput').click()">
    <div class="camera-icon">📸</div>
    <div class="capture-btn-label">التقاط وتوثيق محطة جديدة الآن</div>
    <div style="font-size: 0.75rem; color: var(--muted);">سيتم رصد الطقس والموقع وتثبيت الدبوس على الخريطة</div>
  </div>
  <input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="handleImageSelection(event)">

  <!-- شاشة التعديل والمعاينة والمشاركة -->
  <div id="editSection">
    
    <!-- بطاقة المعاينة بنسبة 9:16 -->
    <div class="preview-wrapper" id="storyExportCard">
      <img id="previewImg" src="" alt="صورة المحطة">
      <div class="overlay-card">
        <div class="overlay-title" id="displayLocation">الرياض</div>
        <div class="overlay-meta" id="displayCoords">24.7136° N, 46.6753° E</div>
        <div class="overlay-weather" id="displayWeather">☀️ --°C</div>
        <div class="overlay-caption" id="displayCaption" style="display:none;"></div>
        <div class="overlay-brand" id="displayDate"></div>
      </div>
    </div>

    <!-- لوحة التعديل والخيارات -->
    <div class="controls-card">
      <div class="input-group">
        <label>📍 اسم الوجهة أو المعلم:</label>
        <input type="text" class="input-field" id="inputLocation" oninput="updatePreview()" placeholder="مثال: قصر المصمك، وادي حنيفة...">
      </div>

      <div class="input-group">
        <label>✍️ كلمة أو تعليق اللحظة:</label>
        <input type="text" class="input-field" id="inputCaption" oninput="updatePreview()" placeholder="مثال: محطة استثنائية في الرياض...">
      </div>

      <div class="toggle-row">
        <span>إظهار حالة الطقس والحرارة</span>
        <input type="checkbox" id="toggleWeather" checked onchange="updatePreview()">
      </div>

      <div class="toggle-row">
        <span>إظهار إحداثيات الـ GPS</span>
        <input type="checkbox" id="toggleCoords" checked onchange="updatePreview()">
      </div>
    </div>

    <!-- أزرار النشر والمشاركة المباشرة -->
    <div class="actions-group">
      <button class="action-btn story" id="shareStoryBtn" onclick="shareToSocial('story')">
        <span>🚀 نشر لستوري سناب شات / إنستغرام</span>
      </button>

      <button class="action-btn whatsapp" id="shareWaBtn" onclick="shareToSocial('whatsapp')">
        <span>💬 إرسال عبر واتساب (محادثة أو حالة)</span>
      </button>
    </div>

    <button class="retake-btn" onclick="resetCapture()">🔄 التقاط صورة أخرى أو العودة للخريطة</button>
  </div>
</div>

<script>
  let map, userMarker;
  let currentLat = 24.7136, currentLon = 46.6753;
  let currentCoordsText = "24.7136° N, 46.6753° E";
  let currentWeatherText = "☀️ 26°C - الرياض";

  // 1. تهيئة الخريطة الداكنة الفاخرة (CartoDB Dark Matter)
  function initMap() {
    map = L.map('map', { zoomControl: false }).setView([currentLat, currentLon], 12);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CartoDB',
      maxZoom: 19
    }).addTo(map);

    // أيقونة ذهبية فخمة للدبوس
    const goldIcon = L.divIcon({
      className: 'custom-pin',
      html: `<div style="background:#d4af37; width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 12px #d4af37;"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    userMarker = L.marker([currentLat, currentLon], { icon: goldIcon }).addTo(map)
      .bindPopup('<b style="color:#000;">أنت هنا - نقطة الانطلاق</b>');

    // تحديد موقع المستخدم الحي بالـ GPS
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLon = pos.coords.longitude;
        currentCoordsText = `${currentLat.toFixed(4)}° N, ${currentLon.toFixed(4)}° E`;
        map.setView([currentLat, currentLon], 14);
        userMarker.setLatLng([currentLat, currentLon]);
        fetchWeather(currentLat, currentLon);
      }, () => {
        fetchWeather(currentLat, currentLon);
      });
    } else {
      fetchWeather(currentLat, currentLon);
    }
  }

  // 2. جلب بيانات الطقس
  async function fetchWeather(lat, lon) {
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m`);
      const data = await res.json();
      currentWeatherText = `🌤️ ${Math.round(data.current.temperature_2m)}°C | رطوبة ${data.current.relative_humidity_2m}%`;
    } catch (e) {
      currentWeatherText = "🌤️ 26°C - معتدل";
    }
    updatePreview();
  }

  // 3. التقاط الصورة وإظهار شاشة التعديل
  function handleImageSelection(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('captureBox').style.display = 'none';
      document.getElementById('editSection').style.display = 'flex';

      const now = new Date();
      document.getElementById('displayDate').innerText = `CHRONICLE • ${now.toLocaleDateString('ar-SA')} - ${now.toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})}`;

      // إضافة دبوس المحطة على الخريطة باسم اللحظة
      const locName = document.getElementById('inputLocation').value.trim() || "محطة جديدة";
      userMarker.bindPopup(`<b style="color:#000;">📍 ${locName}</b><br><small style="color:#555;">تم التوثيق بالصورة</small>`).openPopup();
      
      updatePreview();
    };
    reader.readAsDataURL(file);
  }

  // 4. تحديث المعاينة الحية للبطاقة
  function updatePreview() {
    const locVal = document.getElementById('inputLocation').value.trim();
    const capVal = document.getElementById('inputCaption').value.trim();
    const showWeather = document.getElementById('toggleWeather').checked;
    const showCoords = document.getElementById('toggleCoords').checked;

    document.getElementById('displayLocation').innerText = locVal || "الرياض";

    const weatherElem = document.getElementById('displayWeather');
    weatherElem.innerText = currentWeatherText;
    weatherElem.style.display = showWeather ? 'flex' : 'none';

    const coordsElem = document.getElementById('displayCoords');
    coordsElem.innerText = currentCoordsText;
    coordsElem.style.display = showCoords ? 'block' : 'none';

    const captionElem = document.getElementById('displayCaption');
    if (capVal) {
      captionElem.innerText = `« ${capVal} »`;
      captionElem.style.display = 'block';
    } else {
      captionElem.style.display = 'none';
    }
  }

  // 5. توليد البطاقة والمشاركة (سناب / إنستا / واتساب)
  async function shareToSocial(targetType) {
    const btn = targetType === 'whatsapp' ? document.getElementById('shareWaBtn') : document.getElementById('shareStoryBtn');
    const originalText = btn.innerHTML;
    btn.innerText = "⏳ جاري إعداد الصورة...";
    btn.style.opacity = "0.7";

    const exportCard = document.getElementById('storyExportCard');

    try {
      const canvas = await html2canvas(exportCard, {
        scale: 2.5,
        useCORS: true,
        backgroundColor: "#000"
      });

      canvas.toBlob(async (blob) => {
        if (!blob) {
          alert("تعذر إنشاء الصورة.");
          btn.innerHTML = originalText;
          btn.style.opacity = "1";
          return;
        }

        const fileName = `Travel-Story-${Date.now()}.png`;
        const file = new File([blob], fileName, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'توثيق سجل الرحالة',
              text: `📍 ${document.getElementById('displayLocation').innerText} ✨`
            });
          } catch (err) {
            console.log("تم إلغاء المشاركة.");
          }
        } else {
          const link = document.createElement('a');
          link.download = fileName;
          link.href = canvas.toDataURL('image/png');
          link.click();

          if (targetType === 'whatsapp') {
            const loc = encodeURIComponent(document.getElementById('displayLocation').innerText);
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('تم حفظ الصورة في ألبومي لمشاركتها معك: ' + loc)}`, '_blank');
          } else {
            alert("تم حفظ بطاقة الستوري في ألبوم الصور! يمكنك الآن فتح سناب شات أو إنستغرام ونشرها من الألبوم مباشرة 📸");
          }
        }

        btn.innerHTML = originalText;
        btn.style.opacity = "1";
      }, 'image/png');

    } catch (e) {
      console.error(e);
      alert("حدث خطأ أثناء معالجة الصورة.");
      btn.innerHTML = originalText;
      btn.style.opacity = "1";
    }
  }

  function resetCapture() {
    document.getElementById('cameraInput').value = "";
    document.getElementById('previewImg').src = "";
    document.getElementById('editSection').style.display = 'none';
    document.getElementById('captureBox').style.display = 'flex';
  }

  window.onload = initMap;
</script>
</body>
</html>
